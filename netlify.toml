[build]
  publish = "."
  command = ""

# Support /mep_projects/* requests transparently
[[redirects]]
  from = "/mep_projects/*"
  to = "/projects/:splat"
  status = 200

# Support /project clean URL
[[redirects]]
  from = "/project"
  to = "/project.html"
  status = 200

# Cache-Control headers for static assets
[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
